<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XME</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #020607;
        color: #7ffcff;
        font-family: Consolas, "Roboto Mono", monospace;
      }

      body {
        display: grid;
        place-items: center;
        text-align: center;
      }

      button {
        margin-top: 16px;
        padding: 10px 20px;
        border: 1px solid rgba(48, 214, 214, 0.5);
        background: rgba(1, 10, 12, 0.82);
        color: #7ffcff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <!-- Shown by Capacitor when https://xme.com.my cannot be reached. -->
    <div>
      <p>XME needs an internet connection.</p>
      <button type="button" onclick="location.href = 'https://xme.com.my'">Try again</button>
    </div>
  </body>
</html>
