<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<!--    <link rel="icon" type="image/svg+xml" href="/vite.svg" />-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTS Project</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b1016;
      }

      /* Boot screen until the app mounts; matches the landing page (ProjectTileLanding.css). */
      .boot-loading-screen {
        min-height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 500px at 50% -260px, rgba(45, 212, 191, 0.08), transparent 70%),
          #0b1016;
        color: #eef2f6;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .boot-loading-screen__panel {
        display: grid;
        justify-items: center;
        gap: 20px;
        width: min(320px, calc(100vw - 48px));
      }

      .boot-loading-screen__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
      }

      .boot-loading-screen__mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-top-color: #2dd4bf;
        animation: boot-loading-spin 900ms linear infinite;
      }

      .boot-loading-screen__logo {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: linear-gradient(135deg, #2dd4bf, #0e7490);
        color: #04201c;
        font-size: 17px;
        font-weight: 800;
      }

      .boot-loading-screen__heading {
        display: grid;
        justify-items: center;
        gap: 4px;
        text-align: center;
      }

      .boot-loading-screen__title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .boot-loading-screen__subtitle {
        color: #8b97a6;
        font-size: 13px;
      }

      .boot-loading-screen__bar {
        position: relative;
        width: 100%;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-loading-screen__bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        animation: boot-loading-slide 1.3s ease-in-out infinite;
      }

      .boot-loading-screen__text {
        color: #5f6b7a;
        font-size: 12px;
      }

      @keyframes boot-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-loading-slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loading-screen__mark::before,
        .boot-loading-screen__bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading-screen" role="status" aria-live="polite">
        <div class="boot-loading-screen__panel">
          <div class="boot-loading-screen__mark" aria-hidden="true">
            <span class="boot-loading-screen__logo">N</span>
          </div>
          <div class="boot-loading-screen__heading">
            <span class="boot-loading-screen__title">NTS Computers SDN BHD</span>
            <span class="boot-loading-screen__subtitle">Digital Twin Platform</span>
          </div>
          <div class="boot-loading-screen__bar" aria-hidden="true"></div>
          <span class="boot-loading-screen__text">Loading workspace…</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
