<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<!--    <link rel="icon" type="image/svg+xml" href="/vite.svg" />-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTS Project</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #020607;
      }

      .boot-loading-screen {
        min-height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(48, 214, 214, 0.14), transparent 34%),
          #020607;
        color: #7ffcff;
        font-family: Consolas, "Roboto Mono", monospace;
      }

      .boot-loading-screen__panel {
        display: grid;
        justify-items: center;
        gap: 10px;
        min-width: 220px;
        padding: 22px 28px;
        border: 1px solid rgba(48, 214, 214, 0.35);
        background: rgba(1, 10, 12, 0.82);
        box-shadow:
          inset 0 0 28px rgba(48, 214, 214, 0.08),
          0 0 32px rgba(48, 214, 214, 0.18);
      }

      .boot-loading-screen__mark {
        width: 14px;
        height: 14px;
        background: #30d6d6;
        box-shadow: 0 0 16px rgba(48, 214, 214, 0.9);
        animation: boot-loading-pulse 900ms ease-in-out infinite alternate;
      }

      .boot-loading-screen__title {
        font-size: 16px;
        font-weight: 900;
        text-shadow: 0 0 10px rgba(48, 214, 214, 0.65);
      }

      .boot-loading-screen__text {
        color: rgba(223, 254, 255, 0.72);
        font-size: 11px;
        font-weight: 800;
      }

      @keyframes boot-loading-pulse {
        from {
          opacity: 0.45;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading-screen" role="status" aria-live="polite">
        <div class="boot-loading-screen__panel">
          <span class="boot-loading-screen__mark" aria-hidden="true"></span>
          <span class="boot-loading-screen__title">NTS Project</span>
          <span class="boot-loading-screen__text">Loading editor...</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
